name: Deploy to GitHub Pages

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build
      # CRA substitutes an empty string for an unset REACT_APP_* var, so a missing key does
      # not fail the build — it silently strips the X-API-Key header and publishes a site
      # that 401s. Fail here instead, in the same shell the value is actually set in:
      # step-level env is not visible to any other step.
      run: |
        test -n "$REACT_APP_API_KEY" || { echo "::error::REACT_APP_API_KEY secret is not set"; exit 1; }
        npm run build
      env:
        REACT_APP_API_KEY: ${{ secrets.REACT_APP_API_KEY }}
      
    - name: SPA fallback (copy index.html to 404.html)
      run: cp build/index.html build/404.html

    - name: Create .nojekyll file
      run: touch build/.nojekyll
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build
